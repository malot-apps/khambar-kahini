<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#101526" />
  <meta name="description" content="খাম্বার কাহিনী — একটি ব্যঙ্গাত্মক কারেন্ট/খাম্বা ইন্ডি গেম" />
  <title>⚡ খাম্বার কাহিনী</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E⚡%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- LOADER -->
  <div id="loader" class="loader">
    <div class="loader-box">
      <div class="logo-bolt">⚡</div>
      <div class="loader-bar"><div class="loader-fill" id="loader-fill"></div></div>
      <div class="loader-text">খাম্বা লোড হচ্ছে… অপেক্ষা করুন 🔌</div>
    </div>
  </div>

  <!-- APP ROOT -->
  <div id="app" class="app hidden">
    <!-- SVG background decorations -->
        <div class="bg-lines" aria-hidden="true">
      <svg width="1100" height="320" viewBox="0 0 1100 320" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="bg-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1b2750" />
            <stop offset="1" stop-color="#0e1428" />
          </linearGradient>
        </defs>
        <rect width="1100" height="320" fill="url(#bg-sky)" />
        <!-- city skyline silhouettes -->
        <g fill="#2b3a68" opacity=".75">
          <rect x="60" y="150" width="70" height="170" rx="2" />
          <rect x="160" y="180" width="90" height="140" rx="2" />
          <rect x="360" y="130" width="120" height="190" rx="2" />
          <rect x="520" y="170" width="80" height="150" rx="2" />
          <rect x="660" y="120" width="110" height="200" rx="2" />
          <rect x="830" y="160" width="90" height="160" rx="2" />
          <rect x="960" y="140" width="100" height="180" rx="2" />
        </g>
        <!-- lit window poles -->
        <g fill="#4a5bb0" opacity=".9">
          <rect x="120" y="20" width="10" height="24" rx="2" />
          <rect x="400" y="15" width="10" height="26" rx="2" />
          <rect x="680" y="30" width="10" height="22" rx="2" />
          <rect x="960" y="15" width="10" height="26" rx="2" />
          <rect x="300" y="26" width="10" height="20" rx="2" />
          <rect x="820" y="34" width="10" height="22" rx="2" />
        </g>
        <!-- streetlights -->
        <g fill="#ffe066">
          <circle cx="135" cy="44" r="4" class="blink-slow" />
          <circle cx="415" cy="41" r="4" class="blink-slower" />
          <circle cx="695" cy="52" r="4" class="blink-slow" />
          <circle cx="975" cy="41" r="4" class="blink-faster" />
          <circle cx="315" cy="40" r="3.5" class="blink-slower" />
        </g>
      </svg>
    </div>

    <div id="stage">
      <!-- BOOT/SCREENS content injected by JS -->
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <!-- Global audio contexts created on first user gesture -->
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
